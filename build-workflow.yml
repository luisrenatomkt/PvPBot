name: Build PvPBot
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Instalar Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> $GITHUB_PATH
      - name: Compilar
        run: gradle setupCIWorkspace build --no-daemon --stacktrace
      - name: Enviar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: PvPBot-jar
          path: build/libs/*.jar
